<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game modes</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#110d18}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:393px;height:852px;transform-origin:0 0;overflow:hidden;background:#110d18;--surface:#1d1729;--border:#3c304c;--muted:#bfb4cf}
.sb{position:absolute;left:0;top:0;width:393px;height:62px;display:flex;align-items:center;padding:2px 9px 0}
.sb .t{flex:1;text-align:center;font-weight:590;font-size:17px;padding-right:6px}
.sb .isl{width:125px;height:37px}
.sb .lv{flex:1;display:flex;justify-content:center;align-items:center;gap:7px}
.top{position:absolute;left:0;top:86px;width:393px;padding:0 16px;display:flex;justify-content:space-between;align-items:flex-end}
.me{display:flex;gap:12px;align-items:center}
.ava{position:relative;width:40px;height:40px;border-radius:20px;border:2px solid #8b4dff;background:#d9d9d9 url(game-modes/avatar.png) center/cover}
.ava img{position:absolute;left:22px;top:24px;width:16px;height:16px}
.bal{display:flex;flex-direction:column;gap:4px;width:81px}
.bal small{font-size:12px;line-height:16px;letter-spacing:-.36px;color:var(--muted)}
.bal div{display:flex;gap:4px;align-items:flex-end;font-weight:700;line-height:22px}
.bal img{width:24px;height:24px}
.topup{display:flex;gap:8px;align-items:center;padding:8px 14px 8px 10px;border-radius:333px;background:linear-gradient(164deg,#8b4dff 14%,#5b21d6 86%);font-size:16px;font-weight:510;line-height:22px;letter-spacing:-.48px}
.topup img{width:24px;height:24px}
.live{position:absolute;left:16px;top:158px;width:377px}
.lh{display:flex;gap:6px;align-items:center;height:20px}
.dot{position:relative;width:6px;height:6px;border-radius:50%;background:#3ddc84}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#3ddc84;animation:ping 1.6s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
.lh b{font-size:13px;font-weight:590;letter-spacing:-.39px}
.lh span{font-size:12px;color:var(--muted)}
.feed{display:flex;height:64px;margin-top:8px;overflow:hidden;border-radius:0 8px 8px 0}
.drop{position:relative;flex:none;width:64px;height:64px;margin-right:8px;border-radius:14px;background:var(--surface);border:1px solid var(--border);overflow:hidden;display:grid;place-items:center}
.drop img{position:relative;width:56px;height:56px;object-fit:contain;z-index:1}
.drop i{position:absolute;left:calc(50% + .5px);top:60px;width:71px;height:239px;transform:translateX(-50%);border-radius:4px;filter:blur(5.35px);background:var(--a)}
.banners{position:absolute;left:16px;top:266px;width:361px;display:flex;flex-direction:column;gap:12px}
.ban{position:relative;overflow:hidden;border-radius:20px;padding:16px}
.ban .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.ban .shade{position:absolute;inset:0}
.ban .copy{position:relative;width:190px;display:flex;flex-direction:column;gap:12px}
.ban h3{font-size:26px;line-height:36px;font-weight:700}
.ban p{font-size:13px;width:180px}
.play{align-self:flex-start;display:flex;gap:6px;align-items:center;height:44px;padding:10px 14px 10px 18px;border-radius:333px;font-size:14px;font-weight:590}
.play img{width:16px;height:16px}
.rocket{height:176px}
.rocket .art{transform:scale(1.05);animation:hover 3.4s ease-in-out infinite}
@keyframes hover{0%,100%{transform:scale(1.05) translate(0,0) rotate(0)}50%{transform:scale(1.05) translate(-2px,-4px) rotate(-.6deg)}}
.pvp{height:160px;border:1px solid var(--border)}
.pvp .art.hit{animation:hit .5s linear}
@keyframes hit{0%{transform:scale(1)}18%{transform:scale(1.05) translateX(-2px)}32%{transform:scale(.99) translateX(2px)}48%{transform:scale(1.02) translateX(-1px)}70%{transform:scale(1)}100%{transform:scale(1)}}
.flash{position:absolute;left:259px;top:78px;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,170,230,.6) 22%,rgba(160,90,255,.25) 45%,transparent 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.spark{position:absolute;left:259px;top:78px;width:2px;height:14px;margin-left:-1px;border-radius:2px;background:linear-gradient(#fff,rgba(255,180,240,0));transform-origin:50% 0;opacity:0;pointer-events:none}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px}
.puff{position:absolute;border-radius:50%;background:rgba(236,220,255,.75);filter:blur(5px)}
.star{position:absolute;width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.4s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:.95;transform:scale(1) rotate(45deg)}}
.short{position:absolute;left:16px;top:626px;width:361px;display:flex;gap:12px}
.sc{position:relative;flex:1;height:100px;border-radius:16px;border:1px solid var(--border);overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:28px}
.sc .pic{position:absolute;left:97.5px;top:-1px;width:72px;height:72px;animation:bob 3s ease-in-out infinite}
.sc .pic img{width:100%;height:100%;object-fit:cover}
.sc .glint{position:absolute;inset:0;-webkit-mask:var(--m) center/cover;mask:var(--m) center/cover;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%) no-repeat;background-size:300% 100%;background-position:120% 0;animation:glint 3.6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes glint{0%,55%{background-position:120% 0}85%,100%{background-position:-20% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.sc .ic{width:24px;height:24px;opacity:.7}
.sc b{font-size:16px;font-weight:590;line-height:18px}
.nav{position:absolute;left:0;bottom:0;width:393px;background:var(--surface);border-top:1px solid rgba(139,77,255,.3);display:flex;gap:18px;justify-content:center;align-items:center;padding:12px 16px 28px}
.nav div{width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;font-size:10px;line-height:14px;color:var(--muted);white-space:nowrap}
.nav div.on{border-radius:16px;background:linear-gradient(137deg,#a46bff 14%,#5b21d6 86%);color:#fff}
.nav img{width:28px;height:28px}
.hi{position:absolute;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.idle *{animation-play-state:paused!important}
</style>
</head>
<body>
<div class="screen idle" id="screen">
  <div class="sb" aria-hidden="true">
    <span class="t">9:41</span><span class="isl"></span>
    <span class="lv">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2A10.6 10.6 0 0 0 8.5.6 10.6 10.6 0 0 0 1 3.6l1.2 1.2a8.9 8.9 0 0 1 6.3-2.5Zm0 3.4c1.5 0 2.8.5 3.9 1.5l1.2-1.2a7.3 7.3 0 0 0-10.2 0l1.2 1.2c1-1 2.4-1.5 3.9-1.5Zm0 3.3c.6 0 1.1.2 1.5.6L8.5 11.1 7 9.6c.4-.4.9-.6 1.5-.6Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#fff" fill-opacity=".4"/></svg>
    </span>
  </div>
  <div class="top">
    <div class="me">
      <div class="ava"><img src="game-modes/settings.svg" alt=""></div>
      <div class="bal"><small>Ваш баланс</small><div><img src="game-modes/tton.svg" alt=""><span><span style="font-size:24px">0</span><span style="font-size:16px">.000</span></span></div></div>
    </div>
    <div class="topup"><img src="game-modes/wallet.svg" alt="">Пополнить</div>
  </div>

  <div class="live">
    <div class="lh"><span class="dot"></span><b>Live</b><span>Последние дропы</span></div>
    <div class="feed" id="feed" aria-hidden="true"></div>
  </div>

  <div class="banners">
    <div class="ban rocket" id="rocket">
      <img class="art" src="game-modes/banner-rocket.jpg" alt="">
      <div class="fx" id="trail"></div>
      <div class="shade" style="background:linear-gradient(90deg,#6b25d7 0%,rgba(107,37,215,.98) 38%,rgba(107,37,215,.15) 75%,rgba(107,37,215,0) 100%)"></div>
      <div class="fx">
        <span class="star" style="left:268px;top:22px;animation-delay:.2s"></span>
        <span class="star" style="left:330px;top:64px;width:9px;height:9px;animation-delay:1.1s"></span>
        <span class="star" style="left:220px;top:52px;width:8px;height:8px;animation-delay:1.7s"></span>
        <span class="star" style="left:340px;top:138px;width:10px;height:10px;animation-delay:.7s"></span>
      </div>
      <div class="copy">
        <div><h3>Ракетка</h3><p style="color:#eee1ff">Множитель до ×100.<br>Успей забрать своё</p></div>
        <span class="play" style="background:#fff;color:#5721af">Играть <img src="game-modes/arrow-violet.svg" alt=""></span>
      </div>
    </div>
    <div class="ban pvp" id="pvp">
      <img class="art" id="pvpArt" src="game-modes/banner-pvp.jpg" alt="">
      <div class="fx" id="clash"><div class="flash" id="flash"></div></div>
      <div class="shade" style="left:-1px;top:-1px;background:linear-gradient(90deg,#1b1427 0%,#1b1427 40%,rgba(27,20,39,.1) 74%,rgba(27,20,39,0) 100%)"></div>
      <div class="copy">
        <div><h3 style="font-size:24px">PVP</h3><p style="color:var(--muted)">Сражайся 1 на 1<br>за чужие кейсы</p></div>
        <span class="play" style="background:#853cfa">В бой <img src="game-modes/arrow-white.svg" alt=""></span>
      </div>
    </div>
  </div>

  <div class="short">
    <div class="sc" style="background:linear-gradient(142.6deg,#382052 0%,#21182f 71.4%)">
      <div class="pic"><img src="game-modes/contracts.png" alt=""><span class="glint" style="--m:url(game-modes/contracts.png);animation-delay:1.8s"></span></div>
      <img class="ic" src="game-modes/contract-icon.svg" alt="">
      <b>Контракты</b>
    </div>
    <div class="sc" style="background:linear-gradient(142.6deg,#23344a 0%,#1e192f 71.4%)">
      <div class="pic" style="animation-delay:-1.5s"><img src="game-modes/crystal.png" alt=""><span class="glint" style="--m:url(game-modes/crystal.png)"></span></div>
      <img class="ic" src="game-modes/arrow-circle.svg" alt="" style="transform:rotate(180deg)">
      <b>Улучшение</b>
    </div>
  </div>

  <div class="nav">
    <div><img src="game-modes/box.svg" alt="">Инвентарь</div>
    <div><img src="game-modes/users.svg" alt="">Пригласить</div>
    <div class="on"><img src="game-modes/home.svg" alt="">Главная</div>
    <div><img src="game-modes/cup.svg" alt="">Рейтинг</div>
    <div><img src="game-modes/star-review.svg" alt="">Награды</div>
  </div>
  <div class="hi"></div>
</div>
<script src="live.js"></script>
<script>
{
const $ = (id) => document.getElementById(id);
Live.fit($("screen"), 393);

/* Live drops: the Figma order first, then a new drop lands on the left
   every couple of seconds and pushes the row right. */
const D = { gift: "#a979ff", star: "#e8b45b", heart: "#67d6ee" };
const make = (k) => {
  const el = document.createElement("div");
  el.className = "drop";
  el.innerHTML = `<img src="game-modes/${k}.png" alt=""><i style="--a:${D[k]}"></i>`;
  return el;
};
const feed = $("feed");
["gift", "star", "heart", "gift", "heart", "star", "gift"].forEach((k) => feed.append(make(k)));
const order = ["star", "heart", "gift", "gift", "star", "heart", "heart", "gift"];
let n = 0;
const drop = () => {
  const el = make(order[n++ % order.length]);
  feed.prepend(el);
  // Width opens with ease-out; the item pops on the serega-emotional spring.
  el.animate([{ width: "0px", marginRight: "0px" }, { width: "64px", marginRight: "8px" }], { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" });
  const frames = [];
  for (let i = 0; i <= 34; i++) {
    const p = Live.spring(i / 50);
    frames.push({ transform: `translateY(${-14 * p}px) scale(${1 - 0.4 * p}) rotate(${-12 * p}deg)`, opacity: Math.min(1, Math.max(0, 1 - p)), offset: i / 34 });
  }
  el.animate(frames, { duration: 680, easing: "linear" });
  while (feed.children.length > 8) feed.lastChild.remove();
};

/* Rocket exhaust: soft puffs leave the nozzle and drift down-left. */
const trail = $("trail");
const puff = () => {
  const s = 6 + Math.random() * 10, el = document.createElement("span");
  el.className = "puff";
  el.style.cssText += `width:${s}px;height:${s}px;left:${232 + Math.random() * 6}px;top:${124 + Math.random() * 6}px`;
  trail.append(el);
  const dx = -40 - Math.random() * 30, dy = 26 + Math.random() * 20;
  el.animate([{ transform: "translate(0,0) scale(.6)", opacity: .9 }, { transform: `translate(${dx}px,${dy}px) scale(1.8)`, opacity: 0 }], { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.2,.8,.2,1)" }).onfinish = () => el.remove();
};

/* PVP: every few seconds the two cases clash — a flash, sparks, a punch. */
const clashFx = $("clash"), art = $("pvpArt"), flash = $("flash");
const clash = () => {
  art.classList.remove("hit"); void art.offsetWidth; art.classList.add("hit");
  flash.animate([{ opacity: 0, transform: "scale(.3)" }, { opacity: 1, transform: "scale(1)", offset: .25 }, { opacity: 0, transform: "scale(1.5)" }], { duration: 560, easing: "ease-out" });
  for (let i = 0; i < 9; i++) {
    const sp = document.createElement("span"), a = (i / 9) * 360 + Math.random() * 20;
    sp.className = "spark";
    clashFx.append(sp);
    const d = 34 + Math.random() * 26;
    sp.animate([{ opacity: 1, transform: `rotate(${a}deg) translateY(6px) scaleY(.4)` }, { opacity: 0, transform: `rotate(${a}deg) translateY(${d}px) scaleY(1)` }], { duration: 460 + Math.random() * 200, easing: "cubic-bezier(.1,.7,.3,1)" }).onfinish = () => sp.remove();
  }
};

let timers = [];
const start = () => {
  stop();
  $("screen").classList.remove("idle");
  timers.push(setInterval(drop, 2200), setInterval(puff, 90), setInterval(clash, 3200), setTimeout(clash, 900));
};
const stop = () => { timers.forEach(clearTimeout); timers = []; $("screen").classList.add("idle"); };
Live.watch(start, stop);
}
</script>
</body>
</html>
