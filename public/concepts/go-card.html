<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO! Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* VOICE: shipped fintech prototype, quiet chrome, one loud object
   IDEA: a physical gel transit pass you can spin in your hand
   PICTURE: the 3D card on a black hero, front = map, back = QR
   COLOUR and TYPE: black / white / greys + lime #D9FF3A and pink #FF1F9E only on the card; Inter
   LAYOUT: a single 393×852 phone, scaled to fit the viewport */
:root{color-scheme:light dark;--page:light-dark(#E8E5E1,#0E0E0E);--hint:light-dark(#77736E,#8A8A8A)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#fff;font:15px/1.35 Inter,-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.wrap{width:393px;transform-origin:0 0}
.hint{color:var(--hint);font-size:13px;text-align:center}
.phone{width:393px;height:852px;overflow:hidden;background:#fff;position:relative;display:flex;flex-direction:column;color:#111;user-select:none;-webkit-user-select:none}
.hero{background:#000;color:#F5F5F5;padding-bottom:56px;position:relative}
.sb{display:block;width:393px;height:62px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:0 20px 24px;font-weight:500}
.ava{width:36px;height:36px;border-radius:50%;background:#2A2A2A;display:grid;place-items:center}
.ava img{width:32px;height:32px;border-radius:50%;display:block;object-fit:cover}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:0;background:none;color:inherit;padding:0;cursor:pointer;border-radius:50%}
.icon-btn:focus-visible,.btn:focus-visible,.stage:focus-visible{outline:2px solid #D9FF3A;outline-offset:3px}
/* card */
.stage{height:251px;margin:0 20px;perspective:1100px;position:relative;touch-action:none;cursor:grab;outline:none;border-radius:34px}
.stage.drag{cursor:grabbing}
.glow{position:absolute;left:12%;right:12%;bottom:-18px;height:46px;border-radius:50%;filter:blur(26px);background:#B8F000;opacity:.55;transition:background .25s}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face svg{width:100%;height:100%;display:block;overflow:visible}
.front{transform:translateZ(3px)}
.back{transform:rotateY(180deg) translateZ(3px)}
.slice{position:absolute;left:0;right:0;top:7.49%;bottom:0;border-radius:33px;background:#A9D800}
.glare{position:absolute;left:0;right:0;top:7.49%;bottom:0;border-radius:33px;pointer-events:none;mix-blend-mode:screen;opacity:.0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 48%,rgba(255,255,255,.15) 54%,transparent 64%) no-repeat;background-size:260% 100%}
.meta{display:flex;justify-content:space-between;padding:20px 20px 0;font-size:13px}
.meta .a{color:#9A9A9A}.meta .b{color:#5C5C5C;font-variant-numeric:tabular-nums}
.tip{position:absolute;left:50%;top:342px;transform:translateX(-50%);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#F5F5F5;font-size:13px;padding:7px 14px;border-radius:16px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.tip.off{opacity:0}
/* sheet */
.sheet{flex:1;background:#fff;border-radius:28px 28px 0 0;margin-top:-28px;position:relative;padding:24px 20px 0;display:flex;flex-direction:column}
.bal{display:flex;justify-content:space-between;align-items:flex-end}
.lbl{color:#6B6B6B;font-size:13px}
.num{font-size:48px;line-height:52px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.num .f{color:#A3A3A3}
.chip{background:#F5F5F5;color:#6B6B6B;font-size:13px;padding:6px 10px;border-radius:12px;margin-bottom:8px;white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:28px;border:0;font:500 15px Inter,system-ui,sans-serif;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.p{background:#111;color:#fff}.btn.s{background:#EBEBEB;color:#111}
.cap{margin-top:28px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#A3A3A3}
.list{margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;animation:in .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.ri{width:40px;height:40px;border-radius:50%;background:#F5F5F5;display:grid;place-items:center;flex:none}
.ri.acc{background:#EFFFB0}
.rt{flex:1}.rt b{display:block;font-weight:500}.rt span,.rv span{font-size:13px;color:#6B6B6B}
.rv{text-align:right;white-space:nowrap}.rv b{display:block;font-weight:500}.rv span{color:#A3A3A3}.rv .m{color:#6B6B6B}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:#111;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.row{animation:none}}
</style>
</head>

<div class="phone">

              <g fill="none" stroke-linecap="round" stroke-linejoin="round">

              <text x="44" y="96" font-family="Inter" font-style="italic" font-weight="900" font-size="30" letter-spacing="-1" fill="#fff" filter="url(#emboss)">GO!</text>

    <div class="meta" id="meta"><span class="a" id="metaA">•••• 9541</span><span class="b" id="metaB">Действует до 12/27</span></div>
    <div class="tip off" id="tip">← Покрутите карту →</div>
  </div>

  <div class="sheet">
    <div class="bal">
      <div><div class="lbl">Баланс</div><div class="num" id="num"><span id="ni">1 240</span><span class="f" id="nf">,00</span> ₽</div></div>
      <div class="chip" id="trips">≈ 20 поездок</div>
    </div>
    <div class="acts">
      <button class="btn p" id="pay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>Оплатить</button>
      <button class="btn s" id="top"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Пополнить</button>
    </div>
    <div class="cap">Сегодня</div>
    <div class="list" id="list"></div>
  </div>

<script>
{
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* fit phone to viewport */
const wrap=$('wrap');
const fit=()=>{wrap.style.transform=`scale(${innerWidth/393})`};
fit();addEventListener('resize',fit);

/* stations */
const st=[[52.78,194.8,8.76],[88.35,133.51,8.76],[192.31,163.61,10.4],[225.14,89.74,8.76],[304.49,87,8.76],[312.7,163.61,8.76]];
$('stations').innerHTML=st.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#stn)" stroke="url(#pink)" stroke-width="6.57"/><ellipse cx="${x-1.2}" cy="${y-r+.9}" rx="${r*.69}" ry="${r*.3}" fill="#fff" fill-opacity=".75" filter="url(#b1)"/>`).join('');

/* QR (decorative pattern with finder squares) */
const N=21,M=96/N;
const finder=(x,y)=>`<rect x="${x*M}" y="${y*M}" width="${7*M}" height="${7*M}" rx="${M*1.6}"/><rect x="${(x+1)*M}" y="${(y+1)*M}" width="${5*M}" height="${5*M}" rx="${M*1.1}" fill="#fff"/><rect x="${(x+2)*M}" y="${(y+2)*M}" width="${3*M}" height="${3*M}" rx="${M*.8}"/>`;
const inFinder=(i,j)=>(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const drawQR=()=>{let s='';for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(inFinder(i,j))continue;if(rnd()>.52)s+=`<rect x="${i*M+.3}" y="${j*M+.3}" width="${M-.6}" height="${M-.6}" rx="${M*.3}"/>`}
$('qr').innerHTML=s+finder(0,0)+finder(N-7,0)+finder(0,N-7)};
drawQR();

/* card physics */
const card=$('card'),stage=$('stage'),glow=$('glow'),gF=$('glareF'),gB=$('glareB'),tip=$('tip');
let ry=0,rx=0,vy=0,vx=0,target=0,dragging=false,raf=0,last=0;
let sx=0,sy=0,sRy=0,lastX=0,lastT=0,moved=0,downT=0;
const render=()=>{
  card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
  const c=Math.cos(ry*Math.PI/180),front=c>=0;
  glow.style.background=front?'#B8F000':'#FF2FA8';
  glow.style.transform=`scaleX(${.35+.65*Math.abs(c)})`;
  glow.style.opacity=(.3+.3*Math.abs(c)).toFixed(2);
  const ph=((ry%360)+360)%360;               // 0..360
  const g=front?(ph>180?ph-360:ph):ph-180;   // -90..90 for visible face
  const pos=50-g*1.1;
  const op=Math.min(.9,Math.abs(g)/35+.12);
  for(const el of [gF,gB]){el.style.backgroundPosition=`${pos}% 0`;el.style.opacity=op.toFixed(2)}
  updateMeta(front);
};
const step=t=>{
  const dt=Math.min(32,t-(last||t))/1000;last=t;
  if(auto)return void(raf=0,last=0);
  if(!dragging){
    const k=reduce?400:170,c=reduce?40:17;
    vy+=(-k*(ry-target)-c*vy)*dt; ry+=vy*dt;
    vx+=(-220*rx-20*vx)*dt; rx+=vx*dt;
    if(Math.abs(ry-target)<.05&&Math.abs(vy)<.05&&Math.abs(rx)<.05&&Math.abs(vx)<.05){ry=target;rx=0;render();raf=0;last=0;return}
  }
  render();raf=requestAnimationFrame(step);
};
const kick=()=>{if(!raf){last=0;raf=requestAnimationFrame(step)}};
const hideTip=()=>tip.classList.add('off');
const flip=dir=>{auto=null;holdAuto();target=Math.round(ry/180)*180+180*(dir||1);hideTip();kick()};

stage.addEventListener('pointerdown',e=>{
  auto=null;holdAuto();
  dragging=true;stage.classList.add('drag');stage.setPointerCapture(e.pointerId);
  sx=lastX=e.clientX;sy=e.clientY;sRy=ry;lastT=downT=performance.now();moved=0;vy=0;hideTip();kick();
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-sx,dy=e.clientY-sy,now=performance.now();
  moved=Math.max(moved,Math.hypot(dx,dy));
  ry=sRy+dx*.55;
  rx=Math.max(-14,Math.min(14,-dy*.12));
  const dt=Math.max(1,now-lastT);vy=(e.clientX-lastX)*.55/dt*1000;lastX=e.clientX;lastT=now;
});
const up=()=>{
  if(!dragging)return;dragging=false;stage.classList.remove('drag');
  if(moved<6&&performance.now()-downT<350){flip(1);return}
  const proj=ry+vy*.18;                       // where the flick would carry it
  let t=Math.round(proj/180)*180;
  const base=Math.round(sRy/180)*180;
  t=Math.max(base-360,Math.min(base+360,t));
  target=t;vx=0;kick();
};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();flip(1)}
  if(e.key==='ArrowRight'){flip(1)}
  if(e.key==='ArrowLeft'){flip(-1)}
});

/* meta line + QR timer */
let left=59,front=true;
const metaA=$('metaA'),metaB=$('metaB');
const updateMeta=f=>{if(f===front)return;front=f;paint()};
const paint=()=>{
  if(front){metaA.textContent='•••• 9541';metaB.textContent='Действует до 12/27'}
  else{metaA.textContent='Покажите QR валидатору';metaB.textContent=`0:${String(left).padStart(2,'0')}`}
};
setInterval(()=>{left--;if(left<0){left=59;drawQR()}if(!front)paint()},1000);

/* balance */
let bal=1240;
const fmt=n=>{const [i,f]=n.toFixed(2).split('.');return [i.replace(/\B(?=(\d{3})+(?!\d))/g,' '),','+f]};
const setBal=n=>{const [i,f]=fmt(n);$('ni').textContent=i;$('nf').textContent=f;$('trips').textContent=`≈ ${Math.floor(n/62)} поездок`};
const animateBal=(from,to)=>{
  if(reduce){setBal(to);return}
  const t0=performance.now(),d=700;
  const tick=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);setBal(from+(to-from)*e);if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
};

/* list */
const ico={
  metro:'<path d="M4 18 L8 6 L12 13 L16 6 L20 18"/>',
  bus:'<path d="M6 17V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v11M6 12h12M8 20v-3M16 20v-3"/>',
  train:'<path d="M7 4h10a2 2 0 0 1 2 2v9a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2zM5 11h14M8 21l2-3M16 21l-2-3"/>',
  plus:'<path d="M12 6v12M6 12h12"/>'
};
const rows=[
  {i:'metro',t:'Метро · Таганская',s:'Тариф «Кошелёк»',v:'−62 ₽',w:'08:42'},
  {i:'bus',t:'Автобус 904',s:'Пересадка 90 минут',v:'0 ₽',w:'09:10',m:1},
  {i:'train',t:'МЦД-2 · Подольск',s:'Зона «Пригород»',v:'−95 ₽',w:'18:27'}
];
const rowHTML=r=>`<div class="row"><div class="ri${r.a?' acc':''}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ico[r.i]}</svg></div><div class="rt"><b>${r.t}</b><span>${r.s}</span></div><div class="rv"><b class="${r.m?'m':''}">${r.v}</b><span>${r.w}</span></div></div>`;
const drawList=()=>{$('list').innerHTML=rows.slice(0,3).map(rowHTML).join('')};
drawList();

$('top').addEventListener('click',()=>{
  const from=bal;bal+=500;animateBal(from,bal);
  rows.unshift({i:'plus',t:'Пополнение · СБП',s:'С карты •• 4417',v:'+500 ₽',w:'сейчас',a:1});
  drawList();
});
$('pay').addEventListener('click',()=>{
  const isFront=Math.cos(ry*Math.PI/180)>=0;
  if(isFront){left=59;drawQR()}
  flip(1);
});

/* Motion: the serega-emotional selector (linear phase, then one damped
   1Hz / decay-10 overshoot), sampled per frame. The intro maps it onto the
   card exactly as the skill maps it onto a glyph; the flips stretch the same
   curve in time so a 180° turn lands and wobbles like a gel pass. */
const W=2*Math.PI;
const sel=t=>t<=0?1:t<.18?1-t/.18:(-1/.18)*Math.sin((t-.18)*W)/(Math.exp(10*(t-.18))*W);
const INTRO=.68,FLIP_S=2.6,FLIP_T=.68*FLIP_S,GAP=1500;
let auto=null,visible=false,idleUntil=0,timer=0,introDone=reduce;
const cardIn=$('cardIn');
const holdAuto=()=>{idleUntil=performance.now()+4500;schedule(4500)};
const schedule=ms=>{clearTimeout(timer);if(!reduce)timer=setTimeout(nextFlip,ms)};
const nextFlip=()=>{
  if(!visible||dragging||raf){schedule(GAP);return}
  const now=performance.now();
  if(now<idleUntil){schedule(idleUntil-now);return}
  ry=target;auto={t0:now,from:ry,to:ry+180};requestAnimationFrame(play);
};
const play=t=>{
  if(!auto)return;
  const lt=(t-auto.t0)/1000;
  if(lt>=FLIP_T){ry=target=auto.to;rx=0;auto=null;render();schedule(GAP);return}
  const p=sel(lt/FLIP_S);
  ry=auto.from+180*(1-p);
  rx=-40*p*(1-p);                      // a slight tilt through the turn
  render();requestAnimationFrame(play);
};
const intro=()=>{
  if(introDone)return;introDone=true;
  const t0=performance.now();
  const f=t=>{
    const lt=(t-t0)/1000;
    if(lt>=INTRO){cardIn.style.cssText='';schedule(900);return}
    const p=sel(lt);
    cardIn.style.transform=`translateY(${32*p}px) scaleY(${1-.22*p}) rotate(${12*p}deg)`;
    cardIn.style.opacity=Math.min(1,Math.max(0,1-p)).toFixed(3);
    cardIn.style.filter=`blur(${(10*Math.max(p,0)).toFixed(2)}px)`;
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
};
if(!reduce){cardIn.style.opacity='0'}
/* Run only while the tile is on screen (a same-origin iframe observes the
   top-level viewport). */
new IntersectionObserver(([e])=>{
  visible=e.isIntersecting;
  if(visible){intro();if(introDone&&!auto)schedule(GAP)}else{clearTimeout(timer)}
},{threshold:.35}).observe(document.body);
render();
}
</script>
