<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Case — Rolling</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:402px;height:874px;transform-origin:0 0;overflow:hidden;background:#000}
.art{position:absolute;left:0;top:0;width:402px;height:715px;object-fit:cover;filter:blur(9px);opacity:.3}
.sb{position:absolute;left:0;top:0;width:402px;height:62px;display:flex;align-items:center;padding:2px 9px 0}
.sb .t{flex:1;text-align:center;font-weight:590;font-size:17px;padding-right:6px}
.sb .isl{width:125px;height:37px;border-radius:100px;background:#000}
.sb .lv{flex:1;display:flex;justify-content:center;align-items:center;gap:7px}
.close{position:absolute;left:20px;top:60px;width:44px;height:44px;border-radius:22px;background:rgba(42,42,44,.72);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center}
.close img{width:24px;height:24px}
.head{position:absolute;left:0;top:114px;width:402px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.head h1{font-size:26px;font-weight:590;line-height:normal}
.head p{font-size:17px;line-height:22px;color:rgba(255,255,255,.6);width:330px}
.reel{position:absolute;left:0;top:280px;width:402px;height:172px;overflow:hidden;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}
.strip{position:absolute;left:0;top:19px;display:flex;gap:8px;will-change:transform}
.card{position:relative;flex:none;width:104px;height:132px;border-radius:14px;border:1px solid var(--b);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,var(--g) 0%,transparent 75%),#141417;transition:box-shadow .4s}
.card .pv{position:relative;width:60px;height:60px;flex:none}
.card .pv img{position:absolute;inset:-30%;width:160%;height:160%}
.card .gap{height:2px}
.card b{font-size:14px;font-weight:590;line-height:normal}
.card i{font-style:normal;font-size:10px;font-weight:590;letter-spacing:.8px;color:var(--c)}
.card .bar{position:absolute;left:-1px;right:-1px;bottom:-1px;height:3px;background:var(--c)}
.card .bar.glow{filter:blur(9.25px)}
.card.win{box-shadow:0 0 0 1px var(--c),0 0 28px -2px var(--c)}
.card.win .pv{animation:pop .68s linear}
@keyframes pop{0%{transform:scale(1)}26%{transform:scale(1.14)}45%{transform:scale(.97)}70%{transform:scale(1.02)}100%{transform:scale(1)}}
.fade{position:absolute;top:-1px;width:90px;height:172px;pointer-events:none}
.fade.l{left:0;background:linear-gradient(90deg,rgba(0,0,0,.95),transparent)}
.fade.r{left:312px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.95))}
.marker{position:absolute;left:194px;top:-1px;width:14px;height:172px;pointer-events:none}
.marker .line{position:absolute;left:6px;top:0;width:2px;height:172px;background:#ff8a1f;box-shadow:0 0 10px rgba(255,138,31,.9)}
.marker img{position:absolute;left:0;width:14px;height:9px}
.chances{position:absolute;left:33px;top:488px;width:336px;padding:8px 16px;border-radius:18px;background:rgba(20,20,23,.85);border:1px solid rgba(255,255,255,.06)}
.chances h2{padding:6px 0;font-size:12px;font-weight:590;letter-spacing:.96px;color:rgba(255,255,255,.45);line-height:normal}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:15px;line-height:normal}
.row span{display:flex;align-items:center;gap:8px;font-weight:510;color:rgba(255,255,255,.85)}
.row .d{position:relative;width:8px;height:8px}
.row .d img{position:absolute;inset:-125%;width:350%;height:350%}
.row em{font-style:normal;font-weight:590}
.btn{position:absolute;left:33px;top:782px;width:336px;height:52px;border-radius:26px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);font:590 17px -apple-system,"SF Pro Text",system-ui,sans-serif;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid #ff8a1f;outline-offset:3px}
</style>
</head>
<body>
<div class="screen" id="screen">
  <img class="art" src="ember/bg.jpg" alt="">
  <div class="sb" aria-hidden="true">
    <span class="t">9:41</span><span class="isl"></span>
    <span class="lv">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2A10.6 10.6 0 0 0 8.5.6 10.6 10.6 0 0 0 1 3.6l1.2 1.2a8.9 8.9 0 0 1 6.3-2.5Zm0 3.4c1.5 0 2.8.5 3.9 1.5l1.2-1.2a7.3 7.3 0 0 0-10.2 0l1.2 1.2c1-1 2.4-1.5 3.9-1.5Zm0 3.3c.6 0 1.1.2 1.5.6L8.5 11.1 7 9.6c.4-.4.9-.6 1.5-.6Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#fff" fill-opacity=".4"/></svg>
    </span>
  </div>
  <div class="close"><img src="ember/close.svg" alt="Close"></div>
  <div class="head">
    <h1>Opening Ember Case</h1>
    <p id="sub">Rolling for your drop…</p>
  </div>
  <div class="reel" aria-hidden="true">
    <div class="strip" id="strip"></div>
    <div class="fade l"></div><div class="fade r"></div>
    <div class="marker"><div class="line"></div><img src="ember/ptr-top.svg" alt="" style="top:0"><img src="ember/ptr-bottom.svg" alt="" style="top:163px"></div>
  </div>
  <div class="chances">
    <h2>DROP CHANCES</h2>
    <div class="row"><span><i class="d"><img src="ember/dot-legendary.svg" alt=""></i>Legendary</span><em style="color:#ff8a1f">0.6%</em></div>
    <div class="row"><span><i class="d"><img src="ember/dot-epic.svg" alt=""></i>Epic</span><em style="color:#d32ce6">3.2%</em></div>
    <div class="row"><span><i class="d"><img src="ember/dot-rare.svg" alt=""></i>Rare</span><em style="color:#8847ff">12.8%</em></div>
    <div class="row"><span><i class="d"><img src="ember/dot-uncommon.svg" alt=""></i>Uncommon</span><em style="color:#4b8bff">28.4%</em></div>
    <div class="row"><span><i class="d"><img src="ember/dot-common.svg" alt=""></i>Common</span><em style="color:#9aa0a6">55.0%</em></div>
  </div>
  <button class="btn" id="skip" type="button">Skip animation</button>
</div>
<script src="live.js"></script>
<script>
{
const $ = (id) => document.getElementById(id);
Live.fit($("screen"), 402);

const R = {
  common: ["#9aa0a6", "rgba(154,160,166,.35)", "rgba(154,160,166,.28)", "COMMON", false],
  uncommon: ["#4b8bff", "rgba(75,139,255,.35)", "rgba(75,139,255,.28)", "UNCOMMON", true],
  rare: ["#8847ff", "rgba(136,71,255,.35)", "rgba(136,71,255,.28)", "RARE", true],
  epic: ["#d32ce6", "rgba(211,44,230,.35)", "rgba(211,44,230,.28)", "EPIC", false],
  legendary: ["#ff8a1f", "rgba(255,138,31,.35)", "rgba(255,138,31,.28)", "LEGENDARY", true],
};
const PRIZES = [
  ["Ash", "ash", "common"], ["Slate", "slate", "common"], ["Tide", "tide", "uncommon"],
  ["Moss", "moss", "uncommon"], ["Nebula", "nebula", "rare"], ["Dusk", "dusk", "epic"],
];
// Common prizes come up most, as the drop chances say.
const POOL = [0, 0, 1, 1, 0, 1, 2, 2, 3, 3, 4, 5];
const EMBER = ["Ember", "ember", "legendary"];
const card = ([name, icon, r]) => {
  const [c, b, g, label, glow] = R[r];
  return `<div class="card" style="--c:${c};--b:${b};--g:${g}"><div class="pv"><img src="ember/${icon}.svg" alt=""></div><div class="gap"></div><b>${name}</b><i>${label}</i><div class="bar${glow ? " glow" : ""}"></div></div>`;
};

/* The final frame follows the Figma order: Tide, Ash, Nebula, Ember, Moss,
   Slate, Dusk. Ember (4th card, 104px wide, 112px pitch) stops dead centre
   under the marker at x = 201: 201 - 3 × 112 - 52 = -187. */
const TAIL = [PRIZES[2], PRIZES[0], PRIZES[4], EMBER, PRIZES[3], PRIZES[1], PRIZES[5], PRIZES[0]];
const LEAD = 34, PITCH = 112, END_X = -187 - LEAD * PITCH;
const strip = $("strip");
let rnd = 11;
const pick = () => { rnd = (rnd * 16807) % 2147483647; return PRIZES[POOL[rnd % POOL.length]]; };
const build = () => {
  const lead = Array.from({ length: LEAD }, pick);
  strip.innerHTML = [...lead, ...TAIL].map(card).join("");
};

const SPIN = 4.2, OVER = 12, HOLD = 2600;
let raf = 0, t0 = 0, timer = 0, playing = false, shown = false;
const win = () => strip.children[LEAD + 3];
const set = (x) => (strip.style.transform = `translate3d(${x}px,0,0)`);
const START = END_X + (LEAD - 3) * PITCH;   // three cards in, the strip looks full
const frame = (now) => {
  const t = (now - t0) / 1000;
  if (t < SPIN) {
    const u = t / SPIN, e = 1 - Math.pow(1 - u, 4);   // long deceleration
    set(START + (END_X - OVER - START) * e);
  } else {
    // Settle back onto the final spot with the serega-emotional spring.
    const lt = t - SPIN;
    set(END_X - OVER * Live.spring(lt));
    if (lt >= 0.68) { set(END_X); land(); return; }
  }
  raf = requestAnimationFrame(frame);
};
const land = () => {
  raf = 0; playing = false;
  win().classList.add("win");
  timer = setTimeout(() => shown && roll(), HOLD);
};
const roll = () => {
  cancelAnimationFrame(raf); clearTimeout(timer);
  build(); set(START);
  playing = true; t0 = performance.now();
  raf = requestAnimationFrame(frame);
};
const skip = () => { cancelAnimationFrame(raf); clearTimeout(timer); set(END_X); land(); };

build(); set(END_X); win().classList.add("win");  // static frame = the design
const sub = Live.gentle($("sub"));
$("skip").addEventListener("click", () => (playing ? skip() : roll()));
Live.watch(
  () => { shown = true; if (!playing) { sub && sub(); roll(); } },
  () => { shown = false; },
);
}
</script>
</body>
</html>
